services:
  - type: web
    name: bloxupgrader
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    scaling:
      minInstances: 1
      maxInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SITE_URL
        value: https://bloxupgrader.com
      - key: SUPABASE_URL
        value: https://ukzunbjjjpylkecwcrtk.supabase.co
